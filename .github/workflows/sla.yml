# Every 15 minutes: escalate open alerts that passed their deadline without an /ack.
name: Alert deadlines
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: live-intake
  cancel-in-progress: false
jobs:
  sla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python live/status.py sla
      - id: save
        run: |
          git config user.name "review-desk-bot"
          git config user.email "review-desk-bot@users.noreply.github.com"
          git add site/live.json data/reviews.db
          if git commit -m "Escalate overdue alerts"; then for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && break; sleep 5; done; echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash live/post_outputs.sh
      - if: steps.save.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - if: steps.save.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - if: steps.save.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
